<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 03</title>
</head>
<body>
    <h1>Teste do Formulário 03</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="inome">Nome Completo:</label>
            <input type="text" name="nome" id="inome" minlength="5" placeholder="ex João da Silva" autocomplete="name" required>
        </p>
        <p>
            <label for="imedia">Média do Aluno</label>
            <input type="number" name="media" id="imedia" placeholder="ex 5.5" step="0.5" required>
        </p>
        <p>
            <label for="imes">Periodo Letivo</label>
            <input type="month" name="mes" id="imes" value="2026-03">
        </p>
        <p>
            <label for="idia">Dia da Prova</label>
            <input type="date" name="dia" id="idia" value="2026-03-29">
        </p>
        <p>
            <label for="ihora">Horário da Prova</label>
            <input type="time" name="hora" id="ihora" value="12:00">
        </p>
        <p>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </p>
    </form>
</body>
</html>
