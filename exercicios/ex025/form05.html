<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 05</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        legend {
            font-size: 1.2em;
        }
    </style>
</head>

<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="isexo" id="imas"> <label for="imas">Masculino</label> <br>
            <input type="radio" name="isexo" id="ifem"> <label for="ifem">Feminino </label><br>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="futebol" id="ifut"> <label for="ifut">Futebol</label> <br>
            <input type="checkbox" name="basquete" id="ibas"> <label for="ibas">Basquete</label> <br>
            <input type="checkbox" name="volei" id="ivol"> <label for="ivol">Volei</label> <br>
            <input type="checkbox" name="natacao" id="inat"> <label for="inat">Natação</label> <br>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>

</html>
